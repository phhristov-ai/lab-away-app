name: Deploy Full Stack App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Java for Spring Boot
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Set up Node for React
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Build frontend
      - name: Build frontend
        working-directory: ./frontend
        env:
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_PAYPAL_CLIENT_ID: ${{ secrets.REACT_APP_PAYPAL_CLIENT_ID }}
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
        run: |
          npm install --legacy-peer-deps
          CI='' npm run build

          
      # Run prerendering
      - name: Prerender frontend
        working-directory: ./frontend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          npm ci
          npm run prerender-ci

      # Upload frontend build to S3
      - name: Upload frontend to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 rm s3://${{ secrets.S3_FRONTEND_BUCKET }} --recursive
          aws s3 sync frontend/build s3://${{ secrets.S3_FRONTEND_BUCKET }} \
            --delete \
            --exact-timestamps \
            --cache-control "no-cache"

       # Make mvnw executable
      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      # Build backend jar
      - name: Build backend JAR
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      # Move JAR to root and stage it
      - name: Stage application.jar for Elastic Beanstalk
        run: |
          cp backend/target/*.jar application.jar
          git add application.jar

      # Deploy only the staged JAR (not source code)
      - name: Deploy to Elastic Beanstalk
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          pip install --user awsebcli
          export PATH=$PATH:~/.local/bin

          eb init -p "Corretto 17 running on 64bit Amazon Linux 2023" Lab-Away --region $AWS_REGION --no-verify-ssl

          eb deploy Lab-Away-env --staged
