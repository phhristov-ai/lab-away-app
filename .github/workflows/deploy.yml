
name: Build and Deploy Full Stack App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  FRONTEND_BUCKET: lab-away-frontend
  EB_APPLICATION: lab-away-production-backend
  EB_ENVIRONMENT: lab-away-production-backend-env
  EB_SOURCE_BUCKET: elasticbeanstalk-eu-north-1-447839931482
  CLOUDFRONT_DISTRIBUTION_ID: E1OQGUP7G8JS82

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          CI: ''
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_PAYPAL_CLIENT_ID: ${{ secrets.REACT_APP_PAYPAL_CLIENT_ID }}
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Build backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Package backend for Elastic Beanstalk
        working-directory: backend
        run: |
          set -euo pipefail
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)"
          test -n "$JAR"
          mkdir -p "$RUNNER_TEMP/eb-bundle"
          cp "$JAR" "$RUNNER_TEMP/eb-bundle/application.jar"
          printf '%s\n' 'web: java -jar application.jar' > "$RUNNER_TEMP/eb-bundle/Procfile"
          cd "$RUNNER_TEMP/eb-bundle"
          zip "$RUNNER_TEMP/backend.zip" application.jar Procfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/build/ "s3://${FRONTEND_BUCKET}/"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Upload backend bundle
        run: |
          aws s3 cp "$RUNNER_TEMP/backend.zip" \
            "s3://${EB_SOURCE_BUCKET}/lab-away-deployments/${GITHUB_SHA}.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$GITHUB_SHA" \
            --source-bundle \
              S3Bucket="$EB_SOURCE_BUCKET",S3Key="lab-away-deployments/${GITHUB_SHA}.zip" \

      - name: Deploy backend
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$GITHUB_SHA"

      - name: Wait for backend deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name "$EB_ENVIRONMENT"

      - name: Show deployed backend
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].[Status,Health,HealthStatus,EndpointURL]' \
            --output table
