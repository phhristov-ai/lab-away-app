name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps
          CI='' npm run build
      
      - name: Copy frontend build to backend resources
        run: |
          mkdir -p backend/src/main/resources/static
          rm -rf backend/src/main/resources/static/*
          cp -r frontend/build/* backend/src/main/resources/static/

      - name: Make mvnw executable
        run: chmod +x backend/mvnw
      
      - name: Build backend jar
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      - name: Copy jar to root for EB deployment
        run: cp backend/target/*.jar ./application.jar

      - name: Stage jar for deployment
        run: git add application.jar

      - name: Deploy to Elastic Beanstalk
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          pip install --user awsebcli
          export PATH=$PATH:~/.local/bin

          eb init -p "Corretto 17 running on 64bit Amazon Linux 2023" Lab-Away --region $AWS_REGION --no-verify-ssl

          eb deploy Lab-Away-env --staged
