<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
</head>
<body>
<h2>New Order: #<span th:text="${orderId}"></span></h2>

<p>You have received an order from <span th:text="${billingName}"></span></p>

<p>The order is as follows:<br>
    Order #<span th:text="${orderId}"></span> (<span th:text="${orderDate}"></span>)</p>

<table border="1" cellpadding="5" cellspacing="0">
    <tr>
        <th>Product</th>
        <th>Quantity</th>
        <th>Price</th>
    </tr>
    <tr th:each="item : ${orderItems}">
        <td th:text="${item.productName}"></td>
        <td th:text="${item.quantity}"></td>
        <td th:text="${item.price}"></td>
    </tr>
</table>

<p>Subtotal: <span th:text="${subtotal}"></span><br>
    Shipping: <span th:text="${shipping}"></span><br>
    Payment method: <span th:text="${paymentMethod}"></span><br>
    <strong>Total: <span th:text="${total}"></span></strong></p>

<h3>Billing address</h3>
<p>
    <span th:text="${billingName}"></span><br>
    <span th:text="${billingAddress}"></span><br>
    <span th:text="${billingCity}"></span>, <span th:text="${billingPostCode}"></span><br>
    <span th:text="${billingCountry}"></span><br>
    <span th:text="${billingPhone}"></span><br>
    <span th:text="${billingEmail}"></span>
</p>

<h3>Shipping address</h3>
<p>
    <span th:text="${shippingName}"></span><br>
    <span th:text="${shippingAddress}"></span><br>
    <span th:text="${shippingCity}"></span>, <span th:text="${shippingPostCode}"></span><br>
    <span th:text="${shippingCountry}"></span>
</p>
</body>
</html>
