# General server settings
server.port=5000
spring.application.name=backend

# ============================================================
# File upload settings
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# SMTP
# ============================================================

mail.host=email-smtp.eu-central-1.amazonaws.com
mail.port=587
mail.protocol=smtp
mail.auth=true
mail.starttls-enabled=true
mail.debug=false

spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================
# SQL
# ============================================================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Keep this temporarily.
# We will change this when we introduce Flyway.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

# ============================================================
# Application
# ============================================================

app.frontend-url=https://www.lab-away.com

server.tomcat.use-apr=NEVER

app.email.admins=phhristov@gmail.com,ivankstanchev@gmail.com
