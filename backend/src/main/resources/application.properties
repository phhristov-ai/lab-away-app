# General server settings
server.port=5000
spring.application.name=backend

# ============================================================
# File upload settings
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# SQL
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

logging.level.org.springframework.security=DEBUG
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

db.username=labaway
db.password=localpassword
db.engine=mysql
db.host=127.0.0.1
db.port=13306
db.name=labaway
db.instanceIdentifier=local

# ============================================================
# Application
# ============================================================

app.frontend-url=https://www.lab-away.com

server.tomcat.use-apr=NEVER

app.email.admins=${APP_EMAIL_ADMINS:}

app.admin.bootstrap.username=admin
app.admin.bootstrap.email=admin@gmail.com
app.admin.bootstrap.password=admin