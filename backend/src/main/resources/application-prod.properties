# ============================================================
# AWS Secrets Manager
# ============================================================

spring.config.import=aws-secretsmanager:${APP_SECRET_NAME}

# ============================================================
# Application
# ============================================================

server.port=5000
spring.application.name=backend

# ============================================================
# HTTP / Compression
# ============================================================

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024

# ============================================================
# File uploads
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# Logging
# ============================================================

logging.level.root=INFO
logging.level.org.springframework=WARN

# ============================================================
# Database
# ============================================================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================================
# Tomcat
# ============================================================

server.tomcat.use-apr=NEVER
